[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storeshot"
version = "0.1.0"
description = "Turn raw device screenshots into App Store and Google Play ready images."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sonay Yarayıcı" }]
keywords = ["app-store", "google-play", "screenshots", "aso", "mobile", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["Pillow>=10.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/sonayyarayici/storeshot"
Issues = "https://github.com/sonayyarayici/storeshot/issues"

[project.scripts]
storeshot = "storeshot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
